services:
  model-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - AUTH_REQUIRED=false
      - MAX_LOADED_MODELS=40
      - MAX_RAM_MB=2400
      - BOOST_MODE=false
    volumes:
      - ./models:/models:ro
      - ./data/processed:/data:ro
      - ./jobs:/app/jobs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    mem_limit: 3g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=128m
    init: true
    restart: unless-stopped
