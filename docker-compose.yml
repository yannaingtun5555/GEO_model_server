services:
  model-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ENVIRONMENT: development
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      MODEL_SERVER_API_KEY: ${MODEL_SERVER_API_KEY:-}
      CORS_ORIGINS: http://localhost:8000
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      MAX_LOADED_MODELS: 40
      MAX_RAM_MB: 2048
      MODEL_MEMORY_EXPANSION_FACTOR: 2.25
      MAX_CONCURRENT_REQUESTS: 20
      QUEUE_TIMEOUT_SECONDS: 5
      REQUEST_EXECUTION_TIMEOUT_SECONDS: 30
      MAX_EXPANDED_SYNC_TARGETS: 40
      VERIFY_MODEL_CHECKSUMS_ON_STARTUP: ${VERIFY_MODEL_CHECKSUMS_ON_STARTUP:-false}
      ALLOW_PROTOTYPE_MODELS: "false"
    volumes:
      - ./models:/models:ro
      - ./data/processed:/data:ro
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    mem_limit: 3g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=128m
    init: true
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
